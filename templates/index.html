<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>스마트 정산기</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <span class="app-icon icon-calculator" aria-hidden="true"></span>
      <h1>스마트 정산기</h1>
    </header>

    <section class="summary-panel" aria-label="정산 요약">
      <div class="summary-primary">
        <strong id="summaryPerHead">0원</strong>
        <span id="summaryPrimaryLabel">1인당</span>
      </div>
      <div class="summary-secondary">
        <div>
          <span id="summarySecondaryLabel">총액</span>
          <strong id="summaryTotal">0원</strong>
        </div>
        <div>
          <span id="summaryTargetCount">0명 · 0건</span>
        </div>
      </div>
    </section>

    <nav class="tab-bar" aria-label="화면 전환">
      <button class="tab-btn active" data-tab="input">입력</button>
      <button class="tab-btn" data-tab="result">결과</button>
    </nav>

    <section id="tabInput" class="tab-page active">
      <section id="startOverCard" class="card start-over-card">
        <details class="start-over-details">
          <summary>
            <span>새 정산 시작</span>
            <strong id="startOverSummary">이전 기록 있음</strong>
          </summary>
          <p class="start-over-text">이전 정산 기록이 남아 있어요.</p>
          <div class="start-over-actions">
            <button id="clearPaymentsBtn" class="ghost-btn">결제내역만 비우기</button>
            <button id="resetBtn" class="danger-btn">전체 새로 시작</button>
          </div>
        </details>
      </section>

      <section id="quickInputCard" class="card">
        <div class="section-title">
          <h2>빠른 입력</h2>
        </div>

        <label class="field-label" for="payerInput">이름</label>
        <input id="payerInput" class="name-input" placeholder="결제자 이름" autocomplete="off" />

        <label class="field-label" for="amountInput">금액</label>
        <input id="amountInput" class="amount-input" inputmode="numeric" pattern="[0-9]*" placeholder="0" />

        <details id="paymentOptions" class="payment-options">
          <summary>사용처 추가 <span>선택</span></summary>
          <label class="field-label" for="placeInput">사용처</label>
          <input id="placeInput" class="place-input" placeholder="예: 식당, 카페" autocomplete="off" />
        </details>

        <button id="savePaymentBtn" class="primary-btn full">결제 저장</button>

        <div class="quick-name-area">
          <div class="section-title sub-title">
            <h3>빠른 이름 선택</h3>
          </div>
          <div id="payerButtons" class="chip-wrap empty">
            <p class="empty-text">저장된 이름이 여기에 표시됩니다.</p>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="section-title">
          <h2 class="title-with-icon">
            <span class="section-icon icon-user" aria-hidden="true"></span>
            멤버 관리
          </h2>
          <span id="memberCountBadge">0명</span>
        </div>
        <div class="member-add-area">
          <label class="field-label" for="memberInput">결제 없이 참여한 사람 추가</label>
          <div class="member-form">
            <input id="memberInput" placeholder="이름 입력" autocomplete="off" />
            <button id="addMemberBtn">추가</button>
          </div>
        </div>
        <div id="memberList" class="list"></div>
      </section>

      <section class="card">
        <div class="section-title">
          <h2 class="title-with-icon">
            <span class="section-icon icon-credit-card" aria-hidden="true"></span>
            최근 결제 내역
          </h2>
          <span id="paymentCountBadge">0건</span>
        </div>
        <div id="paymentList" class="list"></div>
      </section>
    </section>

    <section id="tabResult" class="tab-page">
      <section class="card">
        <div class="section-title">
          <h2>정산 대상자</h2>
          <span id="targetCountBadge">0명</span>
          <button id="targetAllToggleBtn" class="target-all-toggle">모두 포함</button>
        </div>

        <div id="targetList" class="target-chip-wrap"></div>

        <details id="paymentExceptions" class="payment-exceptions">
          <summary>
            <span>결제별 예외 설정</span>
            <strong id="customPaymentCountBadge">예외 0건</strong>
          </summary>
          <p class="exception-help">필요한 결제만 선택해 부담자를 따로 지정할 수 있어요.</p>
          <div id="exceptionPaymentList" class="exception-payment-list"></div>
          <div id="exceptionEditor" class="exception-editor"></div>
        </details>
      </section>

      <section class="card">
        <div class="section-title">
          <h2>정산 결과</h2>
          <span>자동 계산</span>
        </div>

        <div id="resultList" class="list"></div>
        <button id="copyResultBtn" class="primary-btn full">결과 복사하기</button>
        <button id="createPngBtn" class="ghost-btn share-create-btn">PNG 공유 이미지 만들기</button>
        <section id="sharePanel" class="share-panel" hidden aria-label="공유 이미지 미리보기">
          <div class="share-panel-title">
            <strong>공유 이미지 미리보기</strong>
            <button id="closeSharePanelBtn" class="small-btn">닫기</button>
          </div>
          <p id="shareStatus" class="share-status" role="status" aria-live="polite"></p>
          <img id="sharePreview" alt="정산 결과 공유 이미지 미리보기" />
          <div class="share-actions">
            <button id="sharePngBtn" class="primary-btn">이미지 공유</button>
            <button id="downloadPngBtn" class="ghost-btn">PNG 저장</button>
          </div>
          <p id="shareSaveHint" class="share-save-hint">저장이 동작하지 않으면 이미지를 길게 눌러 저장하세요.</p>
        </section>
      </section>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="{{ url_for('static', filename='settlement-core.js') }}"></script>
  <script src="{{ url_for('static', filename='share-report.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
